# sheldon configuration file
shell = "zsh"

[plugins]

# Powerlevel10k instant prompt (must be first)
[plugins.p10k-instant-prompt]
inline = '''
if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
  source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
fi
'''

# compinit
[plugins.compinit]
inline = 'autoload -Uz compinit && compinit'

# oh-my-zsh library (core functions)
[plugins.oh-my-zsh]
github = "ohmyzsh/ohmyzsh"
use = ["lib/*.zsh"]

# jonathan theme (disabled)
# [plugins.jonathan-theme]
# github = "ohmyzsh/ohmyzsh"
# use = ["themes/jonathan.zsh-theme"]

# Powerlevel10k theme
[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"

# p10k configuration
[plugins.p10k-config]
inline = '[[ ! -f ~/.config/zsh/.p10k.zsh ]] || source ~/.config/zsh/.p10k.zsh'

# oh-my-zsh git plugin
[plugins.ohmyzsh-git]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/git"

# zsh-completions
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# zsh-autosuggestions
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# zsh-syntax-highlighting (must be last)
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

# fzf
[plugins.fzf]
github = "junegunn/fzf"
use = ["shell/*.zsh"]

# zoxide
[plugins.zoxide]
inline = 'eval "$(zoxide init zsh)"'
